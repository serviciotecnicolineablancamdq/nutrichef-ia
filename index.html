<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriChef IA - Tu Despensa Inteligente</title>
    <!-- Tailwind CSS para un diseño moderno y responsivo -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Encabezado -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-emerald-500 text-slate-950 p-2 rounded-xl font-bold">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">NutriChef IA</h1>
                    <p class="text-xs text-slate-400">Control Inteligente</p>
                </div>
            </div>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full font-medium">
                GitHub Ready
            </span>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-6">
        
        <!-- Tarjetas de Resumen -->
        <div class="grid grid-cols-3 gap-3">
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl text-center">
                <span class="text-xs text-slate-400 block mb-1">Total</span>
                <span id="count-total" class="text-xl font-bold text-slate-200">0</span>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl text-center">
                <span class="text-xs text-amber-400 block mb-1">Por vencer</span>
                <span id="count-warning" class="text-xl font-bold text-amber-400">0</span>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl text-center">
                <span class="text-xs text-rose-400 block mb-1">Vencidos</span>
                <span id="count-expired" class="text-xl font-bold text-rose-400">0</span>
            </div>
        </div>

        <!-- Acciones Principales -->
        <div class="space-y-3">
            <button onclick="alert('Próximamente: Escáner de tickets con IA')" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-semibold py-3.5 px-4 rounded-2xl shadow-lg shadow-emerald-950/50 flex items-center justify-center space-x-2 active:scale-[0.98] transition">
                <i class="fa-solid fa-camera"></i>
                <span>Escanear Ticket de Compra</span>
            </button>
            <button onclick="agregarAlimentoModal()" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 font-medium py-3 px-4 rounded-2xl flex items-center justify-center space-x-2 transition">
                <i class="fa-solid fa-plus text-emerald-400"></i>
                <span>Agregar alimento manual</span>
            </button>
        </div>

        <!-- Listado de Despensa -->
        <div class="space-y-3">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Mi Despensa</h2>
            <div id="pantry-list" class="space-y-2">
                <!-- Estado Vacío -->
                <div class="text-center py-12 px-4 bg-slate-900/50 border border-slate-900 rounded-3xl">
                    <div class="text-slate-600 text-4xl mb-3">
                        <i class="fa-solid fa-box-open"></i>
                    </div>
                    <p class="text-slate-300 font-medium">Tu despensa está vacía</p>
                    <p class="text-xs text-slate-500 mt-1">Agrega alimentos o escanea un ticket para empezar.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Pie de página / Navegación móvil simulada -->
    <footer class="bg-slate-900 border-t border-slate-800 py-3 text-center text-xs text-slate-500">
        NutriChef IA &copy; 2026 - Version Base GitHub
    </footer>

    <script>
        function agregarAlimentoModal() {
            const nombre = prompt("Nombre del alimento:");
            if (nombre) {
                alert(`¡Alimento "${nombre}" registrado con éxito en tu base local!`);
            }
        }
    </script>
</body>
</html>
